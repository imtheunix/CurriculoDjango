{% extends 'base.html' %}
{% block content %}
<div class="container px-5 py-24 mx-auto flex flex-col h-full w-full">
  <h1 class="font-medium title-font text-gray-900 mb-1 text-xl text-center justify-center">Public Chat</h1>
  <div onclick="myFunction()" id="x" class="flex justify-end"><svg class="fill-current h-6 w-6 text-red-500" role="button" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><title>Close</title><path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/></svg></div>
  <div id="myDIV" class="bg-indigo-100 border-t border-b border-blue-500 text-blue-700 px-2 py-3" role="alert">
    <p class="font-bold">&#164 Everyone sees what you post here</p>
    <p class="text-sm">&#164 Likely your messages won't stay here for a long time</p>
    <p class="text-sm">&#164 Be kind</p>
  </div>
  
<div class="container px-5 pb-12 mx-auto flex flex-col h-full w-full">
<style>


.chattexto {
  border: 2px solid #dedede;
  background-color: #f1f1f1;
  border-radius: 5px;
  padding: 10px;
  margin: 10px 0;
}

.darker {
  border-color: #ccc;
  background-color: #ddd;
}

.chattexto::after {
  content: "";
  clear: both;
  display: table;
}

.chattexto img {
  float: left;
  max-width: 60px;
  width: 100%;
  margin-right: 20px;
  border-radius: 50%;
}

.chattexto img.right {
  float: right;
  margin-left: 20px;
  margin-right:0;
}

.time-right {
  float: right;
  color: #aaa;
}

.time-left {
  float: left;
  color: #999;
}
</style>



<div id="display" class="overflow-y-auto container px-12 py-24 mx-auto flex flex-col max-h-96	">

</div>

{% if request.user.is_superuser %}
<script>
$(document).ready(function(){

setInterval(function(){
    $.ajax({
        type: 'GET',
        url : "/getMessages/{{room}}/",
        success: function(response){
            console.log(response);
            $("#display").empty();
            for (var key in response.messages)
            {
                var temp="<a href='{% url 'apagar' username %}'><div class='chattexto overflow-y-auto'><b>"+response.messages[key].user+"</b><p>"+response.messages[key].value+"</p><span class='time-left'>"+response.messages[key].date+"</span></div></a>";
                $("#display").append(temp);
            }
        },
        error: function(response){
            alert('An error occured')
        }
    });
},1000);
})
</script>
<p>{{ room_id }}</p>

{% else %}
<script>
  $(document).ready(function(){
  
  setInterval(function(){
      $.ajax({
          type: 'GET',
          url : "/getMessages/{{room}}/",
          success: function(response){
              console.log(response);
              $("#display").empty();
              for (var key in response.messages)
              {
                  var temp="<div class='chattexto'><b>"+response.messages[key].user+"</b><p>"+response.messages[key].value+"</p><span class='time-left'>"+response.messages[key].date+"</span></div>";
                  $("#display").append(temp);
              }
          },
          error: function(response){
              alert('An error occured')
          }
      });
  },1000);
  })
</script>
{% endif %}

<div class="chattexto py-24">
    <style>
    input[type=text], select {
    width: 100%;
    padding: 12px 20px;
    margin: 8px 0;
    display: inline-block;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    }

    .display {
    border-radius: 5px;
    background-color: #f2f2f2;
    padding: 20px;
    }
    </style>

    <form id="post-form">
        {% csrf_token %}
        <input type="hidden" name="username" id="username" value="{{username}}"/>
        <input type="hidden" name="room_id" id="room_id" value="{{room_details.id}}"/>
        <textarea autofocus type="text" name="message" id="message" class="resize-none w-full h-24 pl-1 pt-1"></textarea>
        <div class="w-full h-10 bottom-0 pt-2">
            <input type="submit" class="w-full h-8 block bg-indigo-600 hover:bg-indigo-800 text-white mx-auto rounded" value="Send">
        </div>
    </form>
</div>


<script type="text/javascript">
  $(document).on('submit','#post-form',function(e){
    e.preventDefault();

    $.ajax({
      type:'POST',
      url:'/send',
      data:{
          username:$('#username').val(),
          room_id:$('#room_id').val(),
          message:$('#message').val(),
        csrfmiddlewaretoken:$('input[name=csrfmiddlewaretoken]').val(),
      },
      success: function(data){
         //alert(data)
      }
    });
    document.getElementById('message').value = ''
  });
</script>
<script>
function myFunction() {
  var x = document.getElementById("myDIV");
  if (x.style.display === "none") {
    x.style.display = "block";
  } else {
    x.style.display = "none";
  }
  var x = document.getElementById("x");
  if (x.style.display === "none") {
    x.style.display = "block";
  } else {
    x.style.display = "none";
  }
}
</script>
</div>
</div>
{% endblock content %}
